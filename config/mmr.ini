# Metropolitan Mobile Radio (MMR), Victoria.
#
# The State's emergency services digital network for Victoria Police, Fire
# Rescue Victoria and Ambulance Victoria across metropolitan Melbourne and
# Geelong. P25 Phase 1 trunked, run on Motorola equipment, in the 400 MHz
# government band.
#
# This is a different network from RMR: RMR is the regional VHF system around
# 165 MHz, MMR is metropolitan and UHF. If you are in Melbourne or Geelong this
# is the one you want.
#
# The centre frequency below covers 412.8 to 416.0 MHz. The band allocated to
# government narrowband voice runs 403-430 MHz, which is far wider than one
# 3.2 MHz block, so sweep it with --tuning-offset in 3.2 MHz steps until you
# find the control channel, then set centre_freq to sit on it.
[rf]
centre_freq = 414400000
# Duplex split for the 400 MHz government band. Verify against the ACMA
# register for your site before trusting it.
duplex_offset = 10000000
channel_spacing = 12500
# Start here and run --self-test; the right value depends on your antenna.
gain = 35
iir_alpha = 0.02
n_channels = 256

[display]
system_name = Metropolitan Mobile Radio (VIC)
min_amp = -20
amp_range = 40
amp_step = 10

[scanner]
active_threshold = -13

[alarm]
mute = False
ignore_list =

[logging]
do_log = True
filename = mmr.log
