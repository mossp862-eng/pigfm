[rf]
centre_freq = 171293750
# Base station downlink sits this far below the mobile uplink. Used by
# --base-station, which tunes down by it for testing.
duplex_offset = 4500000
channel_spacing = 12500
gain = 20
iir_alpha = 0.02
n_channels = 256

[display]
system_name = Regional Mobile Radio (VIC)
min_amp = -20
amp_range = 40
amp_step = 10

[scanner]
active_threshold = -13

[alarm]
mute = False
ignore_list = 172, 248

[logging]
do_log = True
filename = rmr.log

