# Regional Mobile Radio, Bendigo and Mount Alexander area.
#
# Centred so the documented control channels for the nearest sites all fall
# inside one 3.2 MHz block, on the base station downlink where the control
# channel lives. Frequencies from the RadioReference database, system 7679:
#
#   Bendigo (site 006)       165.9750 Ctrl   166.5750 Ctrl   165.2250  165.8250
#   Mt Alexander (site 045)  166.3375 Ctrl   166.4875 Ctrl   165.4375  165.8875
#   Mt Gisborne (site 054)   166.2500 Ctrl   166.5500 Ctrl   165.2000  165.8000
#
# Tuned here PiGFM is on the downlink, so it hears the network rather than the
# radios. For radios near you, add --tuning-offset 4500000 to move to the
# uplink, or use config/rmr.ini which is centred there already.
[rf]
# Deliberately a half-multiple of the channel spacing: channel centres sit at
# centre + 6250, so this puts them on exact 12.5 kHz multiples where the real
# channels are. Centring on a multiple puts every channel half a slot out.
centre_freq = 166293750
duplex_offset = 4500000
channel_spacing = 12500
# Measured on this receiver: 30 and 40 give the same SNR, 49.6 overloads.
gain = 35
iir_alpha = 0.02
n_channels = 256

[display]
system_name = RMR Bendigo / Mt Alexander
min_amp = -20
amp_range = 40
amp_step = 10

[scanner]
active_threshold = -13

[alarm]
mute = False
ignore_list =

[logging]
do_log = True
filename = rmr_bendigo.log
